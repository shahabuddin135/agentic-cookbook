[project]
name = "agentic-cookbook-backend"
version = "0.1.0"
description = "AI-powered recipe discovery backend — FastAPI + OpenAI Agents SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.21",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    "openai-agents>=0.0.17",
    "litellm>=1.50.0",
    "python-multipart>=0.0.9",
    "pexels-mcp-server",
    "mcp>=1.1.2",
    "beautifulsoup4>=4.12.0",
]
